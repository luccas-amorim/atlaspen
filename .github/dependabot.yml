# O atualizador de dependências (decisão de 26/10/2026).
#
# No dia 3 de cada mês, de manhã, dois dias depois da rodada do Conferidor (dia
# 1º), o Dependabot abre PR com o que saiu de novo. Até 15/11/2026 era toda
# quarta-feira; passou a mensal com o resto da rotina, para que o mês tenha uma
# semana de triagem (ensaio no dia 27, rodada e faxina no dia 1º, dependências no
# dia 3) e não um assunto por semana. `interval: monthly` cairia no dia 1º, em
# cima da rodada, e por isso a agenda é por cron. Isto regula só as atualizações
# de VERSÃO: o alerta de segurança do Dependabot não espera o dia 3. As atualizações menores e de
# correção vêm AGRUPADAS — um PR por família, para não virar enxurrada —, e
# cada versão maior vem sozinha, porque é a que pode quebrar: a do
# github-script v9, por exemplo, deixou de aceitar require('@actions/github').
# O PR passa pela CI como qualquer outro. Com a CI verde, o minor e o patch
# entram sozinhos (.github/workflows/dependabot.yml); o merge da versão maior
# continua sendo de gente.
#
# Python fica de fora porque não há o que acompanhar: a CI instala `pytest` e
# `openpyxl` sem versão fixa, e eles já vêm sempre na mais nova. Se um dia
# entrar um requirements.txt com versões fixas, ele ganha um bloco `pip` aqui.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 3 * *"
      timezone: America/Sao_Paulo
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 3 * *"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    # Os tipos do Node acompanham o Node em que o projeto roda — o 24, de
    # `node-version` nos workflows —, não o mais novo publicado. Na primeira
    # rodada, em 26/10/2026, o Dependabot propôs o @types/node 26 (#61), e o
    # typecheck deixou de reconhecer Array.prototype.at em três arquivos.
    # Quando os workflows subirem de Node, sobe este teto junto.
    ignore:
      - dependency-name: "@types/node"
        versions: [">=25"]
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
        update-types: [minor, patch]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: [minor, patch]
      desenvolvimento:
        dependency-type: development
        update-types: [minor, patch]
      demais:
        dependency-type: production
        update-types: [minor, patch]
