name: Conferidor semanal

# Toda segunda-feira, 05:00 de Brasília, em dois atos:
#
#   1. CONFERIR — baixa os textos compilados dos diplomas do catálogo, confronta
#      com static/data/crimes.json e olha o DOU da semana em busca de lei penal
#      nova. O que sair daí vira UMA ISSUE, para triagem humana.
#   2. PROPOR — do que é inequívoco, abre UM PR por rodada, de UM diploma, com a
#      evidência de cada mudança: moldura ou espécie de pena divergente do
#      compilado, em linha que já existe; sentinela defasada (a página já anota
#      lei mais nova); e modificador cujo dispositivo declara fração e alcance
#      ("na hipótese do § 10") — estes dois desde 28/09/2026. As sentinelas vão
#      todas juntas, de qualquer fonte; sozinhas, também abrem PR. Merge continua
#      sendo decisão de gente.
#
# 100% determinístico: sem IA e sem token de modelo. O custo é alguns minutos de
# Actions por semana.

on:
  schedule:
    # UTC. Brasília é UTC-3 fixo desde o fim do horário de verão (2019).
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      abrir_pr:
        description: 'Abrir o PR das correções mecânicas (moldura, sentinela, modificador de escopo declarado)'
        type: boolean
        default: true
      incluir_linhas_novas:
        description: >-
          Incluir linhas NOVAS no PR (exige revisão de modelagem: a primeira
          leva automática trouxe 29 registros que não eram tipos penais)
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: escreve-na-main
  cancel-in-progress: false

# A rodada semanal são VÁRIOS robôs, não um. Antes eram passos de um job só, e o
# log dizia apenas "conferidor falhou" — era preciso abrir a execução para saber
# qual deles. Agora cada um é um job com nome próprio, e quatro correm em
# paralelo: só o auditor e o cotejador dependem dos snapshots que o vigia baixa.
#
#   vigia        — relê a moldura de cada tipo contra o compilado do Planalto
#   sentinela    — varre o DOU atrás de lei penal nova e autônoma
#   recenseador  — mensal, dentro do job da sentinela: baixa TODAS as leis do ano,
#                  uma a uma, atrás da lei penal que ninguém leu
#   auditor      — hediondez, ação penal e nome do tipo (o que a pena não alcança)
#   arquivista   — saúde da prosa: documento vencido ou que fala de algo que mudou
#   cotejador    — segunda leitura: o compilado anota as leis que o Senado
#                  registra? Lê os snapshots do vigia, e só pergunta
#   relator      — o que o STF e o STJ decidiram na semana sobre a lei vigiada, lido no
#                  Banco Nacional de Precedentes do CNJ
#   triagem      — junta os relatórios e abre a issue da semana
#
# Documentado para quem lê o site em docs/os-robos.md.
jobs:
  # ── vigia ────────────────────────────────────────────────────────────────
  # O único que baixa páginas, e por isso o único de que os outros dependem.
  vigia:
    name: Vigia — moldura contra o compilado
    runs-on: ubuntu-latest
    outputs:
      codigo: ${{ steps.conferir.outputs.codigo }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # ~70 páginas com 1,2 s de intervalo: alguns minutos, carga desprezível
      # para o Planalto. A sentinela de cada fonte reprova página truncada ou
      # servida de cache velho, em vez de deixar o differ comparar com lixo.
      - name: Baixar os textos compilados
        id: baixar
        run: python3 scripts/robos/nucleo/baixar.py --todas

      - name: Conferir o catálogo
        id: conferir
        # exit 3 = há achados; é resultado, não falha.
        run: |
          set +e
          python3 scripts/robos/vigia/conferir.py
          codigo=$?
          set -e
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          if [ "$codigo" -ne 0 ] && [ "$codigo" -ne 3 ]; then exit "$codigo"; fi

      - name: Guardar relatório e snapshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: conferidor-${{ github.run_number }}
          path: |
            crawler/relatorios/
            crawler/snapshots/
          retention-days: 30

  # ── sentinela ────────────────────────────────────────────────────────────
  # O ponto cego do vigia é a lei penal NOVA e autônoma: diploma que ainda não
  # está em fontes.json e, portanto, em página nenhuma que ele releia. Este job
  # cobre só isso, e não depende de snapshot — ele lê o DOU, não o Planalto.
  # Falha aqui não derruba a rodada: o in.gov.br fora do ar não pode calar o
  # relatório do catálogo.
  sentinela:
    name: Sentinela — lei penal nova no DOU
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      codigo: ${{ steps.dou.outputs.codigo }}
      leis_do_ano: ${{ steps.leis_do_ano.outputs.codigo }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Data de Brasília: o runner roda em UTC, e às 21h do dia 31 já é dia 1º.
      - name: Dia do mês em Brasília
        id: dia
        run: echo "dia=$(TZ=America/Sao_Paulo date +%-d)" >> "$GITHUB_OUTPUT"

      - name: Olhar o DOU da semana
        id: dou
        run: |
          set +e
          python3 scripts/robos/sentinela/dou_watcher.py --dias 8 > /dev/null
          echo "codigo=$?" >> "$GITHUB_OUTPUT"
      # A defesa contra o falso NEGATIVO: o que o filtro NÃO pegou não deixa
      # rastro em lugar nenhum. Uma vez por mês, a lista de leis sancionadas do
      # ano — que é a fonte, não um comentário sobre ela — é confrontada com o
      # que o watcher examinou. O que sobra é a lista de leis que ninguém olhou.
      - name: Recenseador — todas as leis do ano, uma a uma
        id: leis_do_ano
        if: fromJSON(steps.dia.outputs.dia) <= 7
        run: |
          set +e
          python3 scripts/robos/recenseador/leis_do_ano.py > /dev/null
          echo "codigo=$?" >> "$GITHUB_OUTPUT"

      - name: Guardar o relatório do DOU
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sentinela-${{ github.run_number }}
          path: crawler/relatorios/
          if-no-files-found: ignore
          retention-days: 30

  # ── auditor ──────────────────────────────────────────────────────────────
  # Hediondez, ação penal, causas de aumento e nome do tipo: os campos que
  # decidem atributos e que a conferência de PENAS não alcança. Lê os snapshots
  # que o vigia baixou — daí o `needs`.
  auditor:
    name: Auditor — hediondez, ação penal e nomes
    needs: vigia
    if: always() && needs.vigia.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      actions: read          # baixar o artifact com os snapshots desta rodada
    outputs:
      codigo: ${{ steps.auditoria.outputs.codigo }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Recuperar os snapshots da rodada
        uses: actions/download-artifact@v5
        with:
          name: conferidor-${{ github.run_number }}
          path: crawler/
      - name: Auditar os campos de classificação
        id: auditoria
        run: |
          set +e
          python3 scripts/robos/auditor/auditar.py > /dev/null
          echo "codigo=$?" >> "$GITHUB_OUTPUT"
      - name: Guardar o relatório da auditoria
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: auditor-${{ github.run_number }}
          path: crawler/relatorios/auditoria-*.md
          if-no-files-found: ignore
          retention-days: 30

  # ── arquivista ───────────────────────────────────────────────────────────
  # A prosa envelhece como o dado, e sem aviso: a convenção C7 do CONTRIBUTING
  # ficou meses mandando o contrário do que o transformador faz. Aqui o
  # documento vence por prazo OU porque algo de que ele fala mudou depois da
  # última conferência. Não depende de nada — só do repositório.
  arquivista:
    name: Arquivista — saúde da documentação
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      codigo: ${{ steps.docs.outputs.codigo }}
    steps:
      # O histórico inteiro: o Arquivista data cada documento pelo último commit
      # que o mudou, e no clone raso de sempre todo arquivo parecia commitado
      # hoje — a rodada de 25/10/2026 deu os 18 documentos por em dia, com três
      # vencidos. Sem histórico, o script agora sai com 2 em vez de afirmar.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verificar a saúde da documentação
        id: docs
        run: |
          set +e
          python3 scripts/robos/arquivista/verificar_documentacao.py --saida crawler/relatorios/documentacao.md > /dev/null
          echo "codigo=$?" >> "$GITHUB_OUTPUT"
      - name: Guardar o relatório da documentação
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: arquivista-${{ github.run_number }}
          path: crawler/relatorios/documentacao.md
          if-no-files-found: ignore
          retention-days: 30

  # ── cotejador ────────────────────────────────────────────────────────────
  # A segunda leitura (plano de fontes abertas, .superpowers/planos/). O Vigia
  # confere o catálogo contra o compilado; ninguém conferia o COMPILADO. Este
  # job pergunta ao Senado quais leis recentes mudaram cada diploma e procura
  # cada uma na página que o Vigia baixou. Lê os snapshots daquele job, e não
  # escreve nada: o que a fonte secundária diz vira pergunta na issue. O
  # Senado fora do ar não derruba a rodada.
  cotejador:
    name: Cotejador — o compilado anota o que o Senado registra?
    needs: vigia
    if: always() && needs.vigia.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      actions: read          # baixar o artifact com os snapshots desta rodada
    outputs:
      codigo: ${{ steps.frescor.outputs.codigo }}
      textos: ${{ steps.textos.outputs.codigo }}
      vetos: ${{ steps.vetos.outputs.codigo }}
      ctresb: ${{ steps.ctresb.outputs.codigo }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Recuperar os snapshots da rodada
        uses: actions/download-artifact@v5
        with:
          name: conferidor-${{ github.run_number }}
          path: crawler/
      - name: Cotejar o frescor com o Senado
        id: frescor
        run: |
          set +e
          python3 scripts/robos/cotejador/frescor.py > /dev/null
          echo "codigo=$?" >> "$GITHUB_OUTPUT"
      # A moldura do Planalto contra a da compilação da Câmara (normas.leg.br).
      - name: Cotejar as molduras com a Câmara
        id: textos
        run: |
          set +e
          python3 scripts/robos/cotejador/textos.py > /dev/null
          echo "codigo=$?" >> "$GITHUB_OUTPUT"
      # Os dois abaixo só informam (saem 0): entram no corpo da issue quando
      # ela abre por outro motivo.
      - name: Vetos do ano que tocam diplomas vigiados
        id: vetos
        run: |
          set +e
          python3 scripts/robos/cotejador/vetos.py > /dev/null
          echo "codigo=$?" >> "$GITHUB_OUTPUT"
      - name: O que mudou no ctresb/leis
        id: ctresb
        env:
          # Sem token, a API do GitHub dá 60 requisições por hora; a leitura usa ~70.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/robos/cotejador/ctresb.py > /dev/null
          echo "codigo=$?" >> "$GITHUB_OUTPUT"
      - name: Guardar o relatório do cotejo
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cotejador-${{ github.run_number }}
          path: crawler/relatorios/cotejo-*
          if-no-files-found: ignore
          retention-days: 30

  # ── relator ──────────────────────────────────────────────────────────────
  # A decisão de tribunal não passa pelo DOU, e até 25/10/2026 nenhum robô a
  # via. Este lê no CNJ os precedentes do STF e do STJ atualizados na semana e
  # separa os que tocam diploma vigiado, registro do catálogo ou atributo penal. Não depende do vigia: a chave de cada registro
  # vem de static/data/crimes.json. Só aponta; o CNJ fora do ar sai 2.
  relator:
    name: Relator — o que o STF e o STJ decidiram sobre a lei vigiada?
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      codigo: ${{ steps.decisoes.outputs.codigo }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Ler o Banco Nacional de Precedentes
        id: decisoes
        run: |
          set +e
          python3 scripts/robos/relator/decisoes.py > /dev/null
          echo "codigo=$?" >> "$GITHUB_OUTPUT"
      - name: Guardar o relatório dos tribunais
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: relator-${{ github.run_number }}
          path: crawler/relatorios/tribunais-*
          if-no-files-found: ignore
          retention-days: 30

  # ── triagem ──────────────────────────────────────────────────────────────
  # A issue é o canal: chega sozinha, tem histórico e permite discutir cada
  # achado em linha. Uma issue por rodada, para que a semana seja unidade de
  # trabalho e o fechamento signifique "triado". Junta o que os robôs
  # produziram — e por isso roda mesmo se algum deles falhar.
  triagem:
    name: Triagem — a issue da semana
    needs: [vigia, sentinela, auditor, arquivista, cotejador, relator]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read          # baixar os artifacts dos robôs
    steps:
      - uses: actions/checkout@v7

      - name: Recuperar os relatórios dos robôs
        uses: actions/download-artifact@v5
        with:
          pattern: '*-${{ github.run_number }}'
          merge-multiple: true
          path: recolhido/

      # Os artifacts têm raízes diferentes (o do vigia guarda `relatorios/` e
      # `snapshots/`; os outros guardam os arquivos soltos). Um `find` põe todos
      # no mesmo lugar sem depender de qual veio de onde.
      - name: Juntar os relatórios num lugar só
        run: |
          mkdir -p crawler/relatorios
          find recolhido -name '*.md' -exec cp -f {} crawler/relatorios/ \; || true
          ls -la crawler/relatorios/ || true

      # Quebra não é silêncio. Cada robô fala por dois códigos: 0 (nada) e 3
      # (achados). Qualquer outro — 1 de exceção, 2 de fonte ilegível, ou vazio
      # de job que nem chegou ao passo — quer dizer que a pergunta da semana
      # ficou sem resposta. Até 25/10/2026 esta triagem só olhava o 3: o
      # Arquivista quebrou toda semana desde agosto, e as rodadas de 12 e
      # 19/10 terminaram verdes, sem issue, com robô caído.
      - name: Quem não terminou
        id: quebrados
        env:
          VIGIA: ${{ needs.vigia.outputs.codigo }}
          SENTINELA: ${{ needs.sentinela.outputs.codigo }}
          RECENSEADOR: ${{ needs.sentinela.outputs.leis_do_ano }}
          AUDITOR: ${{ needs.auditor.outputs.codigo }}
          ARQUIVISTA: ${{ needs.arquivista.outputs.codigo }}
          COTEJADOR: ${{ needs.cotejador.outputs.codigo }}
          COTEJADOR_TEXTOS: ${{ needs.cotejador.outputs.textos }}
          COTEJADOR_VETOS: ${{ needs.cotejador.outputs.vetos }}
          COTEJADOR_CTRESB: ${{ needs.cotejador.outputs.ctresb }}
          RELATOR: ${{ needs.relator.outputs.codigo }}
          EXECUCAO: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          : > quebrados.md
          avaliar() {
            case "$2" in
              0|3) ;;
              *) echo "- **$1**: código \`${2:-ausente}\`" >> quebrados.md ;;
            esac
          }
          avaliar "Vigia" "$VIGIA"
          avaliar "Sentinela" "$SENTINELA"
          # O Recenseador só roda na primeira semana do mês: vazio fora dela é
          # o esperado, e não quebra.
          [ -n "$RECENSEADOR" ] && avaliar "Recenseador" "$RECENSEADOR"
          avaliar "Auditor" "$AUDITOR"
          avaliar "Arquivista" "$ARQUIVISTA"
          avaliar "Cotejador (frescor)" "$COTEJADOR"
          avaliar "Cotejador (molduras)" "$COTEJADOR_TEXTOS"
          avaliar "Cotejador (vetos)" "$COTEJADOR_VETOS"
          avaliar "Cotejador (ctresb/leis)" "$COTEJADOR_CTRESB"
          avaliar "Relator" "$RELATOR"
          if [ -s quebrados.md ]; then
            {
              echo "## Robôs que não terminaram"
              echo
              echo "O que eles vigiam ficou SEM resposta nesta rodada — não é o mesmo que \"nada a relatar\". O log está na [execução]($EXECUCAO)."
              echo
              cat quebrados.md
            } > crawler/relatorios/quebrados.md
            echo "houve=1" >> "$GITHUB_OUTPUT"
            cat crawler/relatorios/quebrados.md
          fi

      - name: Abrir issue com os achados
        if: >-
          needs.vigia.outputs.codigo == '3' || needs.sentinela.outputs.codigo == '3'
          || needs.auditor.outputs.codigo == '3'
          || needs.arquivista.outputs.codigo == '3'
          || needs.sentinela.outputs.leis_do_ano == '3'
          || needs.cotejador.outputs.codigo == '3'
          || needs.cotejador.outputs.textos == '3'
          || needs.relator.outputs.codigo == '3'
          || steps.quebrados.outputs.houve == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Cada relatório é procurado pelo NOME, sem a data. Aqui só chegam os
          # desta rodada (crawler/relatorios é ignorado pelo git e vem vazio do
          # checkout), e cada robô data o seu pelo relógio de Brasília na hora
          # em que roda. A rodada manual de 25/10/2026 começou às 23h41 e a
          # triagem rodou depois da meia-noite: procurou relatórios de 26/10,
          # achou os de 25, e a issue #51 saiu sem tribunais, cotejos e DOU.
          # Sai 0 sempre: o shell do passo roda com -e, e o relatório que não
          # veio não pode derrubar a issue dos que vieram.
          ler() { for f in "$@"; do [ -f "$f" ] && cat "$f" && echo; done; return 0; }
          R=crawler/relatorios
          D='[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]'
          # A data do título é a do primeiro relatório datado — o dia em que a
          # rodada começou —, e a de Brasília agora só se nenhum veio.
          HOJE="$(ls $R/$D*.md $R/*-$D.md 2>/dev/null | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort | head -1)"
          [ -n "$HOJE" ] || HOJE="$(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          # O RESUMO, e nao o relatorio completo: o corpo da issue tem teto
          # de 65.536 caracteres, e o despejo dos registros que a lei nao
          # comina empurrava para fora justamente o que pede acao. Id por id
          # continua no artifact, que a primeira linha do corpo nomeia.
          RESUMOS="$(ls $R/$D-resumo.md 2>/dev/null || true)"
          [ -n "$RESUMOS" ] || RESUMOS="$(ls $R/$D.md 2>/dev/null || true)"
          {
            echo "Rodada automática do conferidor contra o texto compilado do Planalto."
            echo
            echo "- Relatório completo e páginas baixadas: **artifact \`conferidor-${{ github.run_number }}\`** desta execução."
            echo "- Cada achado é uma **pergunta**, não uma conclusão: confira o dispositivo no compilado antes de alterar o catálogo."
            echo "- Decisão de modelagem já tomada vai para \`scripts/robos/vigia/excecoes.json\`, com motivo e data; defasagem real vira patch."
            echo "- As correções mecânicas desta rodada podem já estar em PR aberto pelo próprio robô."
            echo
            echo "---"
            echo
            ler $R/quebrados.md
            ler $RESUMOS
            ler $R/dou-$D.md
            ler $R/auditoria-$D.md
            ler $R/documentacao.md
            ler $R/cotejo-*-$D.md
            ler $R/tribunais-$D.md
            # O Recenseador entrava no código da issue e não no corpo: com 3,
            # a issue abria sem dizer que lei ler.
            ler $R/leis-do-ano-[0-9][0-9][0-9][0-9].md
            echo
          } > corpo.md
          # O corpo da issue tem limite de 65.536 caracteres.
          if [ "$(wc -c < corpo.md)" -gt 60000 ]; then
            head -c 60000 corpo.md > corpo-curto.md
            echo >> corpo-curto.md
            echo "_(relatório truncado — veja o artifact para a lista completa)_" >> corpo-curto.md
            mv corpo-curto.md corpo.md
          fi
          # A rodada de hoje SUBSTITUI a da semana passada -- mas so a que
          # ninguem comentou. O conferidor e SEM ESTADO: ele re-deriva tudo a
          # cada rodada, entao achado que continua valendo REAPARECE aqui
          # sozinho. O que nao reaparece e o que uma pessoa escreveu: a
          # leitura do dispositivo, a duvida, a decisao a meio caminho. Issue
          # com comentario deixou de ser foto da semana e virou conversa, e
          # conversa nao se fecha por automatismo -- ganha so um ponteiro
          # para a rodada nova e fica aberta ate alguem decidir.
          REPO="${{ github.repository }}"
          ANTERIORES="$(gh issue list --repo "$REPO" --label conferidor --state open --json number,comments --jq '.[] | "\(.number):\(.comments | length)"')"
          NOVA="$(gh issue create --repo "$REPO" --title "Conferidor: achados de $HOJE" --label conferidor --body-file corpo.md)"
          echo "aberta: $NOVA"
          for PAR in $ANTERIORES; do
            N="${PAR%%:*}"; COMENTARIOS="${PAR##*:}"
            if [ "$COMENTARIOS" -eq 0 ]; then
              gh issue close "$N" --repo "$REPO" --reason "not planned" --comment "Superada pela rodada de $HOJE: $NOVA. Nada se perde: o conferidor re-deriva tudo a cada rodada, entao achado que continuar valendo reaparece la. Ninguem tinha comentado esta." || true
            else
              gh issue comment "$N" --repo "$REPO" --body "A rodada de $HOJE saiu: $NOVA. Esta fica ABERTA porque tem discussao -- os achados se re-derivam, o que foi escrito aqui nao. Feche quando a discussao tiver destino: um commit, uma excecao julgada, ou uma issue propria com titulo que diga o que." || true
              echo "mantida aberta (tem $COMENTARIOS comentario(s)): #$N"
            fi
          done

      - name: Registrar que não houve achado
        if: >-
          needs.vigia.outputs.codigo == '0' && needs.sentinela.outputs.codigo != '3'
          && needs.auditor.outputs.codigo != '3'
          && needs.arquivista.outputs.codigo != '3'
          && needs.cotejador.outputs.codigo != '3'
          && needs.cotejador.outputs.textos != '3'
          && needs.relator.outputs.codigo != '3'
          && steps.quebrados.outputs.houve != '1'
        run: echo "Catálogo em dia com o texto compilado e nada penal no DOU."

  # ── Carimbo da conferência e PR das correções mecânicas ───────────────────
  # Job separado de propósito: escreve no repositório e, por isso, é o único que
  # pede o token do app — que o Environment prende à `main`.
  #
  # Roda em TODA rodada, mesmo sem achado: é aqui que a trilha de auditoria é
  # atualizada, e "conferido hoje, tudo certo" é justamente o caso que mais
  # importa registrar.
  propor:
    needs: vigia
    if: >-
      needs.vigia.result == 'success'
      && (github.event_name != 'workflow_dispatch' || inputs.abrir_pr)
    runs-on: ubuntu-latest
    # O Environment é a trava SERVER-SIDE dos secrets do app: com a política de
    # branch restrita à `main`, o GitHub recusa entregar a chave a um job que
    # rode em qualquer outra branch (o mesmo desenho do regen-data.yml).
    environment: automacao
    permissions:
      contents: write
      pull-requests: write
      actions: read          # baixar o artifact com os snapshots desta rodada
    steps:
      # Sem o app, o PR sairia como github-actions[bot] — que não atravessa o
      # ruleset da main e, pior, deixaria o mantenedor sem poder aprovar o
      # próprio PR. Sem o app configurado, o job não abre PR: os achados seguem
      # na issue, como antes.
      - name: Token do app de automação
        id: app
        if: vars.APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Sem app configurado, não há PR
        if: steps.app.outputs.token == ''
        run: |
          echo "::warning::APP_CLIENT_ID não configurado — os achados ficam só na issue."
          exit 0

      - uses: actions/checkout@v7
        if: steps.app.outputs.token != ''
        with:
          token: ${{ steps.app.outputs.token }}

      # Um PR aberto por vez. Empilhar PRs do robô sobre o mesmo arquivo produz
      # conflito garantido e revisão apressada — o próximo diploma espera a
      # semana seguinte.
      - name: Já existe PR do conferidor aberto?
        id: aberto
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          n=$(gh pr list --repo "${{ github.repository }}" --label conferidor \
                --state open --json number --jq 'length')
          echo "quantidade=$n" >> "$GITHUB_OUTPUT"
          [ "$n" -eq 0 ] || echo "::notice::$n PR do conferidor já aberto — nada a fazer nesta rodada."

      - uses: actions/setup-python@v7
        if: steps.app.outputs.token != ''
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        if: steps.app.outputs.token != ''
        with:
          node-version: 24
          cache: npm

      # O differ lê os snapshots baixados no job anterior.
      - name: Recuperar os snapshots da rodada
        if: steps.app.outputs.token != ''
        uses: actions/download-artifact@v5
        with:
          name: conferidor-${{ github.run_number }}
          path: crawler/

      # A trilha de auditoria: quando cada registro foi confrontado com a lei,
      # com que resultado e contra qual página. Vai direto para a `main`, sem
      # PR — é registro do que a máquina fez, não proposta de mudança de dado.
      - name: Carimbar a conferência
        if: steps.app.outputs.token != ''
        env:
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          python3 scripts/robos/vigia/conferir.py --carimbar > /dev/null || true
          python3 scripts/transform_data.py --estrito --max-contradicoes=0
          if [ -n "$(git status --porcelain data/conferencia.json static/data/crimes.json)" ]; then
            git config user.name "${SLUG:-atlaspen-automacao}[bot]"
            git config user.email "${SLUG:-atlaspen-automacao}[bot]@users.noreply.github.com"
            git add data/conferencia.json static/data/crimes.json
            git commit -m "chore(catalogo): carimbo da conferência semanal [skip ci]"
            git push
          else
            echo "Trilha inalterada."
          fi

      - name: Montar a proposta
        id: propor
        if: steps.app.outputs.token != '' && steps.aberto.outputs.quantidade == '0'
        run: |
          set +e
          python3 scripts/robos/proponente/propor.py --aplicar --saida crawler/proposta \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.incluir_linhas_novas) && '--com-novas' || '' }}
          codigo=$?
          set -e
          # 1 = nada mecânico. Aí a vez é da auditoria de classificação, que
          # propõe hediondez e ação penal — mudanças que PEDEM juízo, e por isso
          # vão em PR, com o fundamento ao lado, em vez de virar linha na issue.
          if [ "$codigo" -eq 1 ]; then
            set +e
            python3 scripts/robos/proponente/propor.py --auditoria --aplicar --saida crawler/proposta
            codigo=$?
            set -e
          fi
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          if [ "$codigo" -eq 0 ]; then
            python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          meta = json.loads(pathlib.Path("crawler/proposta/meta.json").read_text(encoding="utf-8"))
          for chave in ("ramo", "titulo", "versao", "fonte", "correcoes", "novas"):
              print(f"{chave}={meta[chave]}")
          PY
          elif [ "$codigo" -ne 1 ]; then
            exit "$codigo"
          fi

      # `changelog:json` e `gerar_completude` não têm dependência externa — o
      # derivado é commitado e a CI compara, então sem regenerar o próprio PR do
      # robô reprovaria na checagem de sincronia.
      - name: Regenerar o derivado e o feed
        if: steps.propor.outputs.codigo == '0'
        run: |
          python3 scripts/transform_data.py --estrito --max-contradicoes=0
          python3 scripts/gerar_completude.py
          npm run changelog:json

      - name: Abrir o PR
        if: steps.propor.outputs.codigo == '0'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RAMO: ${{ steps.propor.outputs.ramo }}
          TITULO: ${{ steps.propor.outputs.titulo }}
          FONTE: ${{ steps.propor.outputs.fonte }}
          CORRECOES: ${{ steps.propor.outputs.correcoes }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          git config user.name "${SLUG:-atlaspen-automacao}[bot]"
          git config user.email "${SLUG:-atlaspen-automacao}[bot]@users.noreply.github.com"
          git checkout -b "$RAMO"
          git add -A
          git commit -F - <<EOF
          fix(catalogo): $CORRECOES correção(ões) em $FONTE conferidas com o compilado

          Rodada automática do conferidor. Cada mudança cita o dispositivo
          conferido no texto compilado do Planalto.
          EOF
          git push --force-with-lease origin "$RAMO"
          gh pr create --repo "${{ github.repository }}" \
            --head "$RAMO" --base main --title "$TITULO" \
            --label conferidor --body-file crawler/proposta/corpo.md

      - name: Nada mecânico nesta rodada
        if: steps.propor.outputs.codigo == '1'
        run: echo "Os achados desta semana exigem decisão humana — só a issue foi aberta."
