name: Fontes — ensaio da rodada

# Dia 27 de cada mês, 23:00 de Brasília — quatro dias antes da rodada do dia 1º.
# Até 14/11/2026 era toda sexta-feira, véspera da rodada semanal de segunda.
# Baixa os ~80 compilados do Planalto exatamente como a rodada do dia 1º os
# baixará, e não guarda o que deu certo: o que se testa é
# se o download VAI FUNCIONAR, não o conteúdo.
#
# Por que não é "atualizar os compilados": o job `vigia` do conferidor já roda
# `baixar.py --todas` a cada rodada, antes de conferir. A rodada
# SEMPRE opera com texto do dia — nunca houve material velho lá. Guardar uma
# cópia do ensaio não a deixaria mais fresca; deixaria menos.
#
# O que de fato quebra a rodada é a fonte: o Planalto fora do ar, uma
# página que mudou de forma e perdeu a sentinela, uma URL que virou 404 depois
# de o diploma ser recompilado. Quando isso acontece, `baixar.py` sai com 2 e o
# `vigia` derruba a rodada inteira — os outros três robôs dependem dele. Achar
# isso no dia 27 dá quatro dias para consertar `data/fontes.json`;
# achar no dia 1º é o mês sem conferência.
#
# A sentinela é a string que prova que a página veio inteira e fresca. Página
# truncada ou servida de cache velho reprova aqui, em vez de deixar o differ
# comparar o catálogo com lixo.

on:
  schedule:
    # 02:00 UTC do dia 28 = 23:00 do dia 27 em Brasília (UTC-3). Todo mês tem
    # dia 28, e fevereiro ainda deixa um dia inteiro antes da rodada.
    - cron: '0 2 28 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ensaio-fontes
  cancel-in-progress: false

jobs:
  ensaio:
    name: Baixar todas as fontes, e só isso
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Baixar os compilados
        id: baixar
        run: |
          set +e
          python3 scripts/robos/nucleo/baixar.py --todas 2>&1 | tee saida.txt
          echo "codigo=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          set -e

      # Com as páginas na mão, a pergunta do Cotejador sai de graça: o compilado
      # anota as leis que o Senado registra? A resposta vai para o resumo desta
      # execução, e não para issue — a rodada faz a mesma pergunta, com as
      # páginas dela. Aqui ela só adianta o que vem.
      - name: Cotejar o frescor com o Senado
        if: always()
        continue-on-error: true
        run: |
          set +e
          python3 scripts/robos/cotejador/frescor.py --saida cotejo/ > /dev/null
          echo "Cotejador: código $?" >> "$GITHUB_STEP_SUMMARY"
          cat cotejo/cotejo-frescor-*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          exit 0

      # O snapshot BOM não é guardado. A rodada baixa o seu, e um artifact do
      # ensaio só serviria para alguém, um dia, comparar o catálogo com um texto
      # de quatro dias atrás sem perceber. O que se guarda, por sete dias, é só a
      # página REJEITADA (`.html.part`) e o `meta.json`: em 14/11/2026 as 77
      # fontes reprovaram com uma página que não era a de bloqueio conhecida, e
      # sem ela na mão não havia como dizer o que o Planalto tinha devolvido.
      - name: Guardar as páginas rejeitadas
        if: steps.baixar.outputs.codigo != '0'
        uses: actions/upload-artifact@v7
        with:
          name: fontes-rejeitadas-${{ github.run_number }}
          path: |
            crawler/snapshots/**/*.html.part
            crawler/snapshots/**/meta.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Abrir issue se alguma fonte falhou
        if: steps.baixar.outputs.codigo != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          HOJE="$(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          TITULO="Fontes: falha no ensaio de $HOJE"
          # O placar e o diagnóstico vêm antes da lista, e a lista vem inteira.
          # Até 04/11/2026 o corpo era o `tail -n 40` da saída: na issue #96 as
          # 77 fontes tinham falhado, e o corte mostrou 40 linhas de "sentinela
          # ausente" sem o "0/77" que dizia que era tudo, nem a causa — o
          # firewall da Presidência bloqueando o runner.
          {
            echo "O ensaio não conseguiu baixar todas as fontes."
            echo "**A rodada do dia 1º vai falhar** se isto não for resolvido:"
            echo "o \`vigia\` sai com erro e os outros três robôs dependem dele."
            echo
            grep -E '^[0-9]+/[0-9]+ fontes íntegras' saida.txt | sed 's/^/**/; s/$/**/' || true
            echo
            if grep -q '^BLOQUEIO:' saida.txt; then
              echo "> [!WARNING]"
              echo "> $(grep '^BLOQUEIO:' saida.txt | sed 's/^BLOQUEIO: //')"
              echo
              echo "Nada em \`data/fontes.json\` resolve isto. Antes de mexer em"
              echo "sentinela ou URL, confira se a mesma fonte baixa de outra máquina:"
              echo "\`python scripts/robos/nucleo/baixar.py --fonte cp\`."
            else
              echo "Cada linha \`✗\` abaixo é uma fonte de \`data/fontes.json\`."
              echo "Se a página mudou de forma, o que mudou é a \`sentinela\`; se o"
              echo "diploma foi recompilado noutra URL, o que mudou é a \`url\`."
            fi
            echo
            echo '```'
            if grep -q '^Falhas:$' saida.txt; then
              sed -n '/^Falhas:$/,$p' saida.txt
            else
              # Sem a lista, o script caiu antes do fim: o rabo da saída é o erro.
              tail -n 40 saida.txt
            fi
            echo '```'
          } > corpo.md

          # Uma issue por vez para este assunto: se a do ensaio anterior ainda
          # está aberta, a fonte continua quebrada e o lugar disso é um
          # comentário, não uma issue nova a cada ensaio.
          ABERTA="$(gh issue list --repo "$REPO" --label fontes --state open --json number --jq '.[0].number // empty')"
          if [ -n "$ABERTA" ]; then
            gh issue comment "$ABERTA" --repo "$REPO" --body-file corpo.md
            echo "comentado em #$ABERTA"
          else
            gh label create fontes --repo "$REPO" --color BFBFBF \
              --description "Uma fonte do Planalto deixou de responder ou mudou de forma." 2>/dev/null || true
            gh issue create --repo "$REPO" --title "$TITULO" --label fontes --body-file corpo.md
          fi

      - name: Fechar a issue de fontes quando tudo voltar
        if: steps.baixar.outputs.codigo == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          HOJE="$(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          gh issue list --repo "$REPO" --label fontes --state open --json number --jq '.[].number' \
          | while read -r N; do
              gh issue close "$N" --repo "$REPO" \
                --comment "Todas as fontes voltaram a responder no ensaio de $HOJE." || true
            done
