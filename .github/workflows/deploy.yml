name: Deploy (GitHub Pages)

# Publica em https://atlaspen.com.br/ (endereço em SITE_URL, src/site/config.ts).
# Requer, no repositório: Settings > Pages > Source = GitHub Actions, e o domínio
# atlaspen.com.br em Settings > Pages > Custom domain. Deploy por Actions ignora
# arquivo CNAME: o domínio vive só nessa configuração.
#
# Enquanto SITE_PUBLICO não for 'true', o que vai ao ar é só a página "em breve"
# de .github/em-breve/, fora dos buscadores. Decisão de 01/10/2026: os textos
# ainda não estão prontos para leitura. O site completo continua sendo
# construído e testado pela CI (ci.yml); publicá-lo é trocar esta linha.

env:
  SITE_PUBLICO: 'false'

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela um deploy em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Página "em breve"
        if: env.SITE_PUBLICO != 'true'
        run: |
          mkdir -p dist
          cp .github/em-breve/index.html .github/em-breve/robots.txt dist/
          cp dist/index.html dist/404.html

      - name: Setup Node
        if: env.SITE_PUBLICO == 'true'
        uses: actions/setup-node@v7
        with:
          # O @astrojs/react 7 exige Node >= 22.23.4; 24 é o que a CI já usa.
          node-version: 24
          cache: npm

      - name: Setup Python
        if: env.SITE_PUBLICO == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar dependências
        if: env.SITE_PUBLICO == 'true'
        run: npm ci

      - name: Build
        if: env.SITE_PUBLICO == 'true'
        run: npm run build

      # A planilha da base é gerada DENTRO do dist, e nunca commitada. Um binário
      # que se regenera a cada build encheria o histórico de diffs ilegíveis, e a
      # cópia commitada envelheceria em relação ao catálogo — que é o defeito que
      # ela existe para não ter. O caminho é fixo: cada publicação substitui a
      # anterior, e nunca há duas no ar.
      - name: Gerar a planilha da base
        if: env.SITE_PUBLICO == 'true'
        run: |
          python3 -m pip install --quiet openpyxl
          python3 scripts/gerar_planilha.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
